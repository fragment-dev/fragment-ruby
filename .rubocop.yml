# The behavior of RuboCop can be controlled via the .rubocop.yml
# configuration file. It makes it possible to enable/disable
# certain cops (checks) and to alter their behavior if they accept
# any parameters. The file can be placed either in your home
# directory or in some project directory.
#
# RuboCop will start looking for the configuration file in the directory
# where the inspected file is and continue its way up to the root directory.
#
# See https://docs.rubocop.org/rubocop/configuration

require:
  - rubocop-graphql
  - rubocop-minitest
  - rubocop-rake

Metrics/MethodLength:
  Max: 25
  Include:
    - '**/*.rb'
  Exclude:
    - 'test/**/*'

Metrics/ParameterLists:
  Max: 8

Metrics/AbcSize:
  Max: 30

# A Sorbet `sig` is a line of its own, so a fully annotated class runs roughly
# half again as long as the same code untyped. These limits are set for annotated
# code; test classes are excluded because splitting a test file by line count
# scatters related cases.
Metrics/ClassLength:
  Max: 200
  Exclude:
    - 'test/**/*'

# Walking a GraphQL AST or an RBI tree is a case analysis over node types; the
# branch count is the shape of the data, not accidental complexity.
Metrics/CyclomaticComplexity:
  Exclude:
    - 'test/**/*'

Metrics/ModuleLength:
  Max: 260
  Exclude:
    - 'test/**/*'

Naming/MethodParameterName:
  # `ik` is Fragment's own term for an idempotency key, and it is what the API
  # and every other SDK call it.
  AllowedNames:
    - ik

AllCops:
  # Matches the gemspec's required_ruby_version and the CI matrix's floor.
  TargetRubyVersion: 3.2

Layout/LineLength:
  Max: 120
  Include:
    - '**/*.rb'
  Exclude:
    - 'test/**/*'
